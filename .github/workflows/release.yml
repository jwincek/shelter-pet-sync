name: Release

# CI already builds the zip on every push, but only as a workflow artifact:
# it expires, and downloading it needs a GitHub login. A release that people
# are told to deploy from needs the zip attached to the release itself.
#
# v1.1.0 was published with no asset at all, which is what prompted this.
on:
  release:
    types: [published]

  # So a release published before this workflow existed — or one whose upload
  # failed — can be fixed without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach to (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    name: Build and attach the distribution zip
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # validate-config.php check 8 proves the header, the version constant,
      # readme.txt's Stable tag, package.json and every block.json agree with
      # EACH OTHER. It cannot know what the release was tagged, so nothing
      # stops a v1.2.0 tag being cut from a tree that still says 1.1.0 — which
      # would publish a zip whose Stable tag serves the wrong code.
      - name: Tag must match the plugin version
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' shelterkit-pets.php | head -1 | tr -d '[:space:]')"

          if [[ "$TAG_VERSION" != "$HEADER_VERSION" ]]; then
            echo "::error::Release is tagged $TAG but the plugin header says $HEADER_VERSION." >&2
            echo "Run bin/bump-version.php $TAG_VERSION and re-tag, or tag v$HEADER_VERSION." >&2
            exit 1
          fi
          echo "Tag $TAG matches the plugin version $HEADER_VERSION."

      - name: Validate config contracts
        run: php bin/validate-config.php

      # The build script fails if a dev file leaks in or a runtime file goes
      # missing, so this is a packaging gate and not just an artifact step.
      - name: Build distribution zip
        id: build
        run: |
          set -euo pipefail
          VERSION="$(./bin/build-dist.sh --zip | tail -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l build/*.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --clobber so re-running this on an existing release replaces the
          # asset rather than failing, which is the whole point of the manual
          # trigger above.
          gh release upload "${{ steps.tag.outputs.tag }}" build/*.zip --clobber
