name: Release

# Publishing is driven entirely by pushing a version tag:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# That one command builds the package, deploys it to WordPress.org, and creates
# the GitHub Release with the installable zip attached.
#
# Deliberately NOT `release: published`. That was the previous trigger, and it
# meant the release had to be created by hand first — so v1.1.1 was published
# with no assets at all when the version bump had not reached main and the
# guard below (correctly) refused to attach anything. Driving from the tag means
# the release cannot exist before the checks have passed.
on:
  push:
    tags:
      - 'v*'

  # For a tag that was pushed before this workflow existed, or a run that failed
  # after the tag was already correct. Everything below is idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, deploy and attach to (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build, deploy to WordPress.org, and attach the zip
    runs-on: ubuntu-latest

    env:
      # Evaluated at job level so the deploy step's `if` can read it reliably.
      # Until the secrets exist the deploy is skipped and everything else still
      # runs, so this is safe to merge before the plugin is approved.
      HAS_SVN_CREDENTIALS: ${{ secrets.SVN_USERNAME != '' }}

    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Git tags are v-prefixed; WordPress.org versions are not. The deploy
          # action defaults VERSION to the raw tag, which would create SVN
          # tags/v1.2.0 while `Stable tag: 1.2.0` points at tags/1.2.0 — a
          # mismatch that silently serves nothing. Strip it once, here.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.tag }}
          # The ancestry check below needs main, which a tag checkout does not
          # fetch on its own.
          fetch-depth: 0

      # v1.2.0 and v1.3.0 were both tagged from their release BRANCH rather than
      # from main. Squash-merging then created a different commit on main with
      # the same content, so those tags point at commits main never took: the
      # release page reads "1 commit to main since this release" forever, and
      # `git log v1.2.0..v1.3.0` is meaningless.
      #
      # Nothing shipped wrong — the trees were identical — but the history is
      # wrong, and documentation alone did not prevent it, because the moment
      # you are ready to tag is the moment you are standing on the branch.
      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${{ steps.ver.outputs.tag }} is on main."
            exit 0
          fi

          echo "::error::${{ steps.ver.outputs.tag }} points at a commit that is not on main." >&2
          echo "Tag from main AFTER the release PR is merged:" >&2
          echo "  git checkout main && git pull && git tag ${{ steps.ver.outputs.tag }} && git push origin ${{ steps.ver.outputs.tag }}" >&2
          echo "To recover: git push --delete origin ${{ steps.ver.outputs.tag }}, then re-tag from main." >&2
          exit 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # validate-config.php check 8 proves the header, the version constant,
      # readme.txt's Stable tag, package.json and every block.json agree with
      # EACH OTHER. It cannot know what the release was tagged, so nothing else
      # stops a v1.2.0 tag cut from a tree that still says 1.1.1 — which would
      # publish a Stable tag pointing at code that does not exist.
      - name: Tag must match the plugin version
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' shelterkit-pets.php | head -1 | tr -d '[:space:]')"

          if [[ "${{ steps.ver.outputs.version }}" != "$HEADER_VERSION" ]]; then
            echo "::error::Release is tagged ${{ steps.ver.outputs.tag }} but the plugin header says $HEADER_VERSION." >&2
            echo "Run bin/bump-version.php ${{ steps.ver.outputs.version }} and re-tag, or tag v$HEADER_VERSION." >&2
            exit 1
          fi
          echo "Tag ${{ steps.ver.outputs.tag }} matches the plugin version $HEADER_VERSION."

      - name: Validate config contracts
        run: php bin/validate-config.php

      # bin/build-dist.sh fails if a dev file leaks in, if a runtime file goes
      # missing, or if any untracked file reaches the output — so this is a
      # packaging gate, not just an artifact step.
      - name: Build distribution package
        run: |
          set -euo pipefail
          ./bin/build-dist.sh --zip
          ls -l build/*.zip

      # The auto-generated "Source code" archive is the whole repository and is
      # not installable, so this is what anyone deploying from GitHub actually
      # wants. --clobber so a re-run replaces rather than fails.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="build/shelterkit-pets-${VERSION}.zip"

          gh release create "$TAG" \
            --title "$VERSION" \
            --notes "See CHANGELOG.md for details." \
            "$ZIP" \
          || gh release upload "$TAG" "$ZIP" --clobber

      # LAST, deliberately. The GitHub Release above is the fallback way to
      # install this plugin, and it must not depend on WordPress.org accepting
      # anything. Before approval the SVN repository does not exist, so a deploy
      # attempted with credentials in place FAILS — and when this step ran first,
      # that failure took the whole job with it and left a tag with no release
      # attached, which is the exact situation this workflow was written to
      # prevent.
      #
      # SLUG must match what WordPress.org actually assigned at approval, which
      # is derived from the submitted plugin name and is not guaranteed to be
      # what we assumed here. Confirm it before adding the secrets.
      #
      # Deploys build/shelterkit-pets to trunk/ and tags/<version>/, and syncs
      # .wordpress-org/ into SVN assets/ — which is a SIBLING of trunk, not
      # inside it, and is the part everyone gets wrong by hand.
      #
      # BUILD_DIR points at what the step above produced rather than letting the
      # action re-derive a package from .distignore, so what WordPress.org
      # serves is byte-identical to the zip attached to the release below.
      - name: Deploy to WordPress.org
        if: env.HAS_SVN_CREDENTIALS == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: shelterkit-pets
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: build/shelterkit-pets
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Note when the deploy was skipped
        if: env.HAS_SVN_CREDENTIALS != 'true'
        run: |
          echo "::notice::WordPress.org deploy skipped — SVN_USERNAME and SVN_PASSWORD are not set."
          echo "::notice::The zip is still built and attached to the GitHub Release below."
