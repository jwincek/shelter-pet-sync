name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer lint

  tests:
    name: PHPUnit (WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    # Both ends of the supported range, because both are CLAIMS in readme.txt.
    # "Tested up to" was drifting behind releases; "Requires at least" was worse
    # — nothing had ever run against 6.9, so the floor was asserted rather than
    # tested, and it is the claim that breaks real users rather than just search
    # ranking. validate-config check 12 keeps these two lists in step with the
    # readme headers.
    strategy:
      fail-fast: false
      matrix:
        wp: [ '6.9', '7.1' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # The unit suite loads no WordPress, so it can run before the test
      # library exists and fails fast on pure-logic regressions.
      - name: Unit suite
        run: composer test:unit

      # An explicit version, not "latest": the test library comes from the
      # wordpress-develop repository, where "latest" is not a tag.
      - name: Install the WordPress test library
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Integration suite
        run: composer test:integration

  validate-config:
    name: Config Contract Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Also enforces version consistency (check 8): the plugin header, the
      # version constant, readme.txt's Stable tag, package.json and every
      # block.json must agree. A Stable tag that doesn't match the tagged
      # release makes WordPress.org serve the wrong code.
      - name: Validate config contracts
        run: php bin/validate-config.php

  js-lint:
    name: JS & CSS Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

  build:
    name: Build distribution zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The script fails if a dev file leaks into the build or a runtime file
      # goes missing, so this job is a release-packaging regression test and
      # not merely an artifact producer.
      - name: Build distribution
        id: build
        run: |
          # pipefail matters: the runner's default shell sets -e but not
          # pipefail, so without it a failing build would be masked by tail's
          # exit 0 and this job would report green on a broken package.
          set -euo pipefail
          VERSION="$(./bin/build-dist.sh --zip | tail -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: shelterkit-pets-${{ steps.build.outputs.version }}
          path: build/*.zip
          if-no-files-found: error

  plugin-check:
    name: Plugin Check (WordPress.org review suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Checked against the BUILT output, not the repo. The repo carries dev
      # files (bin/, phpcs.xml.dist, dotfiles) that never ship; running the
      # checks there reports errors users would never hit while missing
      # whatever the packaging step actually produces.
      - name: Build distribution
        run: ./bin/build-dist.sh

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./build/shelterkit-pets
          # Warnings are dominated by PHPCS treating block render.php
          # template-scope variables as globals — WordPress includes those
          # files inside a function scope, so they are not. phpcs.xml.dist
          # already excludes /blocks/* for that sniff; Plugin Check runs its
          # own ruleset and cannot see that config.
          ignore-warnings: true
